name: CI

# Quand déclencher le workflow.
on:
  push:
    branches: [main]
  pull_request:

# Annule les runs en cours sur la même branche/PR quand un nouveau commit arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format : rapide, tourne sur Linux (pas de dépendance plateforme).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Tests : sur Windows (cible réelle du projet — soundcard a besoin de Win/Pulse).
  # ---------------------------------------------------------------------------
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project + dev deps (sans l'extra "transcribe" qui pèse 5+ GB)
        run: uv sync --group dev

      - name: Run pytest (+ coverage)
        # pytest-cov produit coverage.xml grâce à la config dans pyproject.toml.
        run: uv run pytest -v

      - name: Upload coverage to Codecov
        # Ne tourne pas sur les forks (le secret n'y est pas dispo) — évite des échecs spurious.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
