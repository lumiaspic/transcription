name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format: fast, runs on Linux (no platform dependency).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Tests: Windows and macOS (soundcard supports WASAPI and CoreAudio).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project + dev deps (without the "transcribe" extra which weighs 5+ GB)
        run: uv sync --group dev

      - name: Run pytest (+ coverage + JUnit report)
        # pytest-cov produces coverage.xml via config in pyproject.toml.
        # --junitxml + junit_family=legacy: format expected by Codecov Test Analytics
        # (flaky test detection, failure dashboard, PR comments).
        run: uv run pytest -v --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        # Does not run on forks (secret not available there) to avoid spurious failures.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov (Test Analytics)
        # Runs even if pytest failed: that is precisely when we want results
        # to show up in the dashboard.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
