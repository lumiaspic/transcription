name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs on the same branch/PR when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + format: fast, runs on Linux (no platform dependency).
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-group dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Tests: Windows and macOS (soundcard supports WASAPI and CoreAudio).
  # ---------------------------------------------------------------------------
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project + dev deps (without the "transcribe" extra which weighs 5+ GB)
        run: uv sync --group dev

      - name: Run pytest (+ coverage + JUnit report)
        # pytest-cov produces coverage.xml via config in pyproject.toml.
        # --junitxml + junit_family=legacy: format expected by Codecov Test Analytics
        # (flaky test detection, failure dashboard, PR comments).
        run: uv run pytest -v --junitxml=junit.xml -o junit_family=legacy

      - name: Upload coverage to Codecov
        # Does not run on forks (secret not available there) to avoid spurious failures.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov (Test Analytics)
        # Runs even if pytest failed: that is precisely when we want results
        # to show up in the dashboard.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
        uses: codecov/test-results-action@v1
        with:
          files: ./junit.xml
          flags: ${{ matrix.os }}-py${{ matrix.python-version }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Installer smoke tests.
  #
  # End-to-end run of the install scripts against the PR's own checkout. We
  # use `--no-extras` to skip `uv sync --extra transcribe` (~3 GB of torch +
  # whisperx wheels) — what's actually being validated is the script logic:
  # argument parsing, prereq detection, git clone/update, base `uv sync`,
  # launcher / shortcut creation. The heavy ML stack is exercised manually
  # on developer machines and well-covered upstream.
  # ---------------------------------------------------------------------------
  installer-smoke-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # We need to be on the actual branch (not a detached HEAD on the
          # merge commit) so the installer can clone --branch <name> from
          # our local checkout.
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Run install.sh against local checkout
        run: |
          BRANCH=$(git branch --show-current)
          TARGET="${RUNNER_TEMP}/transcription-smoke"
          bash packaging/install.sh \
            --install-dir "${TARGET}" \
            --repo-url "${GITHUB_WORKSPACE}" \
            --branch "${BRANCH}" \
            --no-extras \
            --no-launch

      - name: Assert install postconditions
        run: |
          TARGET="${RUNNER_TEMP}/transcription-smoke"
          test -d "${TARGET}/.git"          || { echo "missing .git";          exit 1; }
          test -f "${TARGET}/pyproject.toml" || { echo "missing pyproject";    exit 1; }
          test -d "${TARGET}/.venv"          || { echo "missing .venv";        exit 1; }
          test -x "${HOME}/.local/bin/transcription-gui" || { echo "missing launcher"; exit 1; }
          bash -n "${HOME}/.local/bin/transcription-gui" # launcher parses

      - name: Re-run installer (exercise the update path)
        run: |
          BRANCH=$(git branch --show-current)
          TARGET="${RUNNER_TEMP}/transcription-smoke"
          bash packaging/install.sh \
            --install-dir "${TARGET}" \
            --repo-url "${GITHUB_WORKSPACE}" \
            --branch "${BRANCH}" \
            --no-extras \
            --no-launch

  installer-smoke-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Run install.ps1 against local checkout
        shell: pwsh
        run: |
          $branch = (git branch --show-current).Trim()
          $target = "$env:RUNNER_TEMP\transcription-smoke"
          .\packaging\install.ps1 `
            -InstallDir $target `
            -RepoUrl $env:GITHUB_WORKSPACE `
            -Branch $branch `
            -NoExtras `
            -NoLaunch

      - name: Assert install postconditions
        shell: pwsh
        run: |
          $target = "$env:RUNNER_TEMP\transcription-smoke"
          if (-not (Test-Path "$target\.git" -PathType Container))         { throw "missing .git" }
          if (-not (Test-Path "$target\pyproject.toml" -PathType Leaf))    { throw "missing pyproject" }
          if (-not (Test-Path "$target\.venv" -PathType Container))        { throw "missing .venv" }
          $desktop = [Environment]::GetFolderPath('Desktop')
          if (-not (Test-Path "$desktop\Transcription.lnk" -PathType Leaf)) { throw "missing Desktop shortcut" }

      - name: Re-run installer (exercise the update path)
        shell: pwsh
        run: |
          $branch = (git branch --show-current).Trim()
          $target = "$env:RUNNER_TEMP\transcription-smoke"
          .\packaging\install.ps1 `
            -InstallDir $target `
            -RepoUrl $env:GITHUB_WORKSPACE `
            -Branch $branch `
            -NoExtras `
            -NoLaunch
