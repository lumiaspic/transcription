# Dependabot: surveille les CVE et ouvre des PR de mise à jour automatiques.
# Doc complète: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Dépendances Python gérées par uv (lit pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Regroupe les bumps mineurs/patchs en une seule PR par semaine — limite le bruit.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Versions des actions dans .github/workflows/*.yml (actions/checkout, astral-sh/setup-uv…).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
