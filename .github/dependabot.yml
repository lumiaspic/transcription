# Dependabot: watches for CVEs and opens automatic update PRs.
# Full docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies managed by uv (reads pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Group minor/patch bumps into a single PR per week to reduce noise.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # setuptools 81 deprecates pkg_resources, 82 removes it — breaks
      # ctranslate2 <4.7 (see pyproject.toml `transcribe` extra). Lift this
      # cap once we require ctranslate2>=4.7.
      - dependency-name: "setuptools"
        versions: [">=81"]

  # Action versions in .github/workflows/*.yml (actions/checkout, astral-sh/setup-uv…).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
