[project]
name = "transcription"
version = "0.1.0"
description = "Local audio capture + WhisperX transcription pipeline"
# 3.11 is the floor because `import tomllib` (config.py) is stdlib only since
# 3.11. The CI matrix already only runs 3.11/3.12; this just makes the
# pyproject claim match reality.
requires-python = ">=3.11,<3.13"
dependencies = [
    "soundcard>=0.4.3",
    "soundfile>=0.14.0",
    "numpy>=2.4.6",
    "typer>=0.27.0",
    "keyring>=24",
    "tomli-w>=1.0",
    # httpx is the HTTP client for the remote_api backend. Kept in base deps
    # (not in `transcribe`) so the remote path works WITHOUT the ~3 GB local
    # transcribe stack — that's the whole point of having a remote backend.
    "httpx>=0.27",
]

[project.scripts]
transcription = "transcription.cli:app"

[project.optional-dependencies]
transcribe = [
    # setuptools<81 because ctranslate2 4.5/4.6 still `import pkg_resources`
    # (see ctranslate2/__init__.py); pkg_resources is deprecated in setuptools
    # 81 and removed in 82, so 82+ breaks `import ctranslate2`.
    # ctranslate2 4.7.0+ switched to importlib.resources — this cap can be
    # lifted once we require >=4.7. Do not let Dependabot raise this (#18).
    "setuptools<81",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    # ctranslate2 4.5+ links against cuDNN 9, which matches what torch 2.5
    # bundles. ctranslate2 4.4 needs cuDNN 8 and breaks on this combo.
    "ctranslate2>=4.8.1",
    "whisperx>=3.8.6",
    # UI (NiceGUI + native window via pywebview: Edge WebView2 on Windows, WebKit on macOS)
    "nicegui>=3.15.0",
    "pywebview>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

# Dev tools (installed via `uv sync --group dev`, never included in the wheel).
[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=5",
    "ruff>=0.16.0",
]

[tool.mypy]
# Type checks on the package only. Tests are loosely typed by convention
# (CliRunner / monkeypatch / fixtures all return dynamic stuff).
files = ["src/transcription"]
python_version = "3.11"
# Conservative starter set — mirrors the ruff approach (lint hygiene without
# forcing every helper to be typed). Tighten over time, not all at once.
#
# `warn_unreachable` is deliberately off: mypy specializes `sys.platform`
# against the runner's own OS, so cross-platform branches always look dead
# from one side. Re-enable behind a per-platform matrix run.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# Third-party libs without bundled type stubs. They are stable surface for us
# (audio I/O, GUI, transcribe extras), and writing local stubs is more work
# than it's worth right now. Revisit if any of these starts misbehaving
# silently.
[[tool.mypy.overrides]]
module = [
    "ctranslate2",
    "nicegui",
    "nicegui.*",
    "soundcard",
    "soundfile",
    "torch",
    "torch.*",
    "webview",
    "whisperx",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Deliberately conservative selection to start — can be tightened later.
#   E,W = pycodestyle    F = pyflakes    I = isort    UP = pyupgrade    B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: left to the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov enables coverage on the `transcription` package; xml is for Codecov,
# term-missing for local feedback. Pass --cov-report= (empty string) on the CLI to disable.
# --cov-fail-under: floor at 90 (currently 93). Leaves ~3% headroom for
# legitimate refactors but catches a meaningful regression in CI.
addopts = "-ra --cov=transcription --cov-report=term-missing --cov-report=xml --cov-fail-under=90"

[tool.coverage.run]
source = ["src/transcription"]
branch = true
# Hardware/UI-coupled modules: excluded until we have proper mocks,
# otherwise coverage % is dominated by untestable code in CI.
omit = [
    "src/transcription/ui/*",
    "src/transcription/audio/*",
    "src/transcription/backends/whisperx_local.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

# PyTorch CUDA wheels are not on PyPI — they live on download.pytorch.org.
# On Windows we pull from the CUDA 12.8 index; on macOS PyTorch ships on PyPI
# with CPU + MPS (Apple Silicon) support, so no custom index is needed there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
