[project]
name = "transcription"
version = "0.0.1"
description = "Local Windows audio capture + WhisperX transcription pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "soundcard>=0.4.3",
    "soundfile>=0.12.1",
    "numpy>=2.2.6",
    "typer>=0.12",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.scripts]
transcription = "transcription.cli:app"

[project.optional-dependencies]
transcribe = [
    # setuptools<81 because ctranslate2 still imports pkg_resources,
    # which was removed in setuptools 81.
    "setuptools<83",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    # ctranslate2 4.5+ links against cuDNN 9, which matches what torch 2.5
    # bundles. ctranslate2 4.4 needs cuDNN 8 and breaks on this combo.
    "ctranslate2>=4.5",
    "whisperx>=3.1.1",
    # UI (NiceGUI + native window via Microsoft Edge WebView2, preinstalled on Win11)
    "nicegui>=2.0",
    "pywebview>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

# Outils de dev (installés via `uv sync --group dev`, jamais embarqués dans le wheel).
[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Sélection volontairement modeste pour démarrer — on durcira plus tard.
#   E,W = pycodestyle    F = pyflakes    I = isort    UP = pyupgrade    B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # longueur de ligne : laissée au formatteur
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov enables coverage on the `transcription` package; xml is for Codecov,
# term-missing for local feedback. --cov-report= (empty) en CLI désactive si besoin.
addopts = "-ra --cov=transcription --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/transcription"]
branch = true
# Modules très liés au matériel/UI : exclus tant qu'on n'a pas de mocks dédiés,
# sinon le % de couverture est dominé par du code intestable en CI.
omit = [
    "src/transcription/ui/*",
    "src/transcription/audio/*",
    "src/transcription/backends/whisperx_local.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

# PyTorch CUDA wheels are not on PyPI - they live on download.pytorch.org.
# We tell uv to fetch torch and torchaudio from the CUDA 12.4 index.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
