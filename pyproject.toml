[project]
name = "transcription"
version = "0.0.1"
description = "Local audio capture + WhisperX transcription pipeline"
requires-python = ">=3.10,<3.13"
dependencies = [
    "soundcard>=0.4.3",
    "soundfile>=0.12.1",
    "numpy>=2.2.6",
    "typer>=0.12",
    "keyring>=24",
    "tomli-w>=1.0",
]

[project.scripts]
transcription = "transcription.cli:app"

[project.optional-dependencies]
transcribe = [
    # setuptools<81 because ctranslate2 4.5/4.6 still `import pkg_resources`
    # (see ctranslate2/__init__.py); pkg_resources is deprecated in setuptools
    # 81 and removed in 82, so 82+ breaks `import ctranslate2`.
    # ctranslate2 4.7.0+ switched to importlib.resources — this cap can be
    # lifted once we require >=4.7. Do not let Dependabot raise this (#18).
    "setuptools<81",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    # ctranslate2 4.5+ links against cuDNN 9, which matches what torch 2.5
    # bundles. ctranslate2 4.4 needs cuDNN 8 and breaks on this combo.
    "ctranslate2>=4.5",
    "whisperx>=3.1.1",
    # UI (NiceGUI + native window via pywebview: Edge WebView2 on Windows, WebKit on macOS)
    "nicegui>=2.0",
    "pywebview>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

# Dev tools (installed via `uv sync --group dev`, never included in the wheel).
[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Deliberately conservative selection to start — can be tightened later.
#   E,W = pycodestyle    F = pyflakes    I = isort    UP = pyupgrade    B = bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length: left to the formatter
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --cov enables coverage on the `transcription` package; xml is for Codecov,
# term-missing for local feedback. Pass --cov-report= (empty string) on the CLI to disable.
addopts = "-ra --cov=transcription --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/transcription"]
branch = true
# Hardware/UI-coupled modules: excluded until we have proper mocks,
# otherwise coverage % is dominated by untestable code in CI.
omit = [
    "src/transcription/ui/*",
    "src/transcription/audio/*",
    "src/transcription/backends/whisperx_local.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

# PyTorch CUDA wheels are not on PyPI — they live on download.pytorch.org.
# On Windows we pull from the CUDA 12.8 index; on macOS PyTorch ships on PyPI
# with CPU + MPS (Apple Silicon) support, so no custom index is needed there.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
